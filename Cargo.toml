[workspace]
resolver = "2"
members = ["crates/proto", "crates/daemon", "crates/acctl", "crates/client-core"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
