[package]
name = "acctl"
version = "0.7.0"
edition = "2021"

[[bin]]
name = "acctl"
path = "src/main.rs"

[dependencies]
proto = { path = "../proto" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
base64 = "0.22"
# Sync GitLab/Gerrit du registre PR : appels REST (rustls — pas d'openssl).
ureq = { version = "2.12", default-features = false, features = ["tls"] }
