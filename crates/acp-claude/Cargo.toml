[package]
name = "acp-claude"
version = "0.1.0"
edition = "2021"
description = "Adaptateur ACP maison : backend Claude CLI (claude -p --input-format stream-json)"

[[bin]]
name = "acp-claude"
path = "src/main.rs"

[dependencies]
acp-core = { path = "../acp-core" }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
