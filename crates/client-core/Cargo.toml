[package]
name = "client-core"
version = "0.2.15"
edition = "2021"

[dependencies]
proto = { path = "../proto" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
# SSH natif (sans binaire ssh) — Android et partout ailleurs en opt-in.
russh = { version = "0.64", default-features = false, features = ["ring", "flate2", "rsa"] }
ssh-key = "=0.7.0-rc.11"
rand_core = "0.10"
getrandom = "0.4"
