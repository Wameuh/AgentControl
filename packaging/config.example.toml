# Configuration agentcontrol-daemon — ~/.agentcontrol/config.toml

# Listener TCP loopback (tunnelé par le client via ssh -L). Ne pas binder 0.0.0.0
# sans TLS/auth — tout le monde sur la machine pourrait piloter les agents.
bind_tcp = "127.0.0.1:7331"

# Interface web : le démon sert la même SPA que le client Tauri — sessions,
# chat live (WebSocket), fichiers, terminal, téléchargements. Loopback
# obligatoire : l'accès distant passe par un tunnel SSH
# (`ssh -N -L <port local>:127.0.0.1:<bind_http> hôte`). Le token d'accès est
# généré dans <root>/web.token (l'URL complète est donnée par `acctl status`).
# bind_http = "127.0.0.1:7332"
# Dossier des assets SPA — défaut : embarqués dans le binaire, puis
# <root>/web, <exe>/web. Utile en dev (`client/dist`) ou install manuelle.
# web_dir = "/chemin/vers/dist"

# Reprise auto après un arrêt brutal (crash, SIGKILL, OOM) : les sessions
# qui travaillaient sont relancées (session/load) et reçoivent un prompt
# "continue please". Les sessions idle ne sont jamais relancées. Un arrêt
# propre (SIGTERM/SIGINT) ne déclenche pas de reprise au boot suivant.
auto_resume = true

# ---------------------------------------------------------------------------
# Rétention / stockage — un janitor applique ces limites périodiquement.
# ---------------------------------------------------------------------------
[retention]
# events.jsonl compacté au-delà de ce seuil (la queue est conservée)
journal_max_mb = 64
journal_keep_mb = 32
# Quota de blobs par session : les plus anciens sont supprimés (LRU)
blob_max_mb = 512
# Purge les sessions inactives (agent mort) sans event depuis N jours. 0 = off
purge_days = 0
# Période du janitor (secondes, min 30)
interval_secs = 600

# ---------------------------------------------------------------------------
# Communication agent↔agent — chaque session reçoit un serveur MCP
# "agentcontrol" (tools: list_sessions / send_message / create_session /
# read_events) et l'env AGENTCONTROL_SOCK + AGENTCONTROL_SESSION (fallback
# via `acctl msg` / `acctl spawn`).
# Un message vers une session morte la relance automatiquement.
# ---------------------------------------------------------------------------
[a2a]
enabled = true
# Max messages par minute et par paire émetteur→cible (anti-boucle, 0 = illimité)
rate_per_min = 20
# Max sessions créées par minute et par session créatrice
# (agentcontrol_create_session — 0 = illimité, comme rate_per_min)
spawn_per_min = 10
# Max sessions agent→agent existantes au total (vivantes ou mortes) —
# borne le fan-out récursif (chaque fille est une créatrice).
# 0 = spawn agent→agent interdit.
spawn_max_sessions = 20

# ---------------------------------------------------------------------------
# Agents ACP. Les placeholders {model} et {mode} sont substitués à la création
# de session (omis si vides).
# ---------------------------------------------------------------------------

[agents.devin]
name = "Devin CLI"
command = ["devin", "acp"]

# DEVIN_PERMISSION_MODE est lue par le CLI au démarrage.
#
# Variantes modèle hors annonce ACP (ex. swe-2-flash-max que Devin
# n'expose pas dans config_options) : les deux clés ci-dessous activent
# le catalogue + l'override side-channel. `catalogue_cmd` liste les
# variantes complètes ; `model_override_cmd` persiste la valeur dans le
# store provider entre le kill de l'agent ACP et le session/load —
# {native_sid} et {model} sont substitués. Sans elles, seules les
# valeurs annoncées ACP sont sélectionnables.
# catalogue_cmd = "devin models list"
# model_override_cmd = "devin -r {native_sid} --model {model} --respect-workspace-trust false"
[agents.devin.env]
DEVIN_PERMISSION_MODE = "{mode}"

# Cursor CLI — ACP natif, preset BUILT-IN (id `cursor`, affiché dans le
# sélecteur de session sans rien déclarer ici). argv[0] est résolu sur
# le PATH au boot (`cursor-agent` puis l'alias `agent`) en chemin
# absolu, puis re-résolu à chaud à chaque `available`/spawn — une
# install postérieure au démarrage du démon est détectée sans restart.
# Login préalable : `cursor-agent login` (ou `agent login`).
# Le mode/modèle demandés à la création sont appliqués via ACP après
# session/new (pas de placeholder).
# Surcharger la commande sans éditer ce fichier : options →
# composants → « agents » (ou `acctl comp set agents cursor
# "agent,acp"`) — persisté ici en `[agents.cursor]` complet.
# [agents.cursor]
# name = "Cursor CLI"
# command = ["agent", "acp"]

# Codex CLI — pas d'ACP natif : via l'adaptateur officiel
# `npm i -g @agentclientprotocol/codex-acp` (repo zed-industries archivé,
# développement déplacé vers agentclientprotocol). Nécessite node sur le
# PATH du démon (ensure_agent_path couvre les dossiers agents usuels :
# ~/.local/bin, ~/.npm-global/bin, shims mise, cargo, nvm…).
# CODEX_PATH doit pointer le binaire codex installé : sans lui,
# l'adaptateur lance son @openai/codex npm embarqué (et sous npx,
# "codex" dans PATH serait le wrapper npm, pas le vrai CLI).
[agents.codex]
name = "Codex CLI"
command = ["codex-acp"]

[agents.codex.env]
CODEX_PATH = "/home/wameuh/.local/bin/codex" # adapter : chemin absolu du codex standalone

# Claude — pas d'ACP natif non plus : via l'adaptateur officiel
# `npm i -g @agentclientprotocol/claude-agent-acp` (embarque le Claude
# Agent SDK → le CLI `claude` n'est PAS requis). Auth requise — l'une
# des deux variables ci-dessous, ou OAuth existant dans ~/.claude :
#   - ANTHROPIC_API_KEY (facturation API)
#   - CLAUDE_CODE_OAUTH_TOKEN : `npm i -g @anthropic-ai/claude-code`
#     puis `claude setup-token` (marche en headless : URL → code).
[agents.claude]
name = "Claude"
command = ["claude-agent-acp"]

# [agents.claude.env]
# CLAUDE_CODE_OAUTH_TOKEN = "…"

# Modèles « extra » hors annonce ACP : claude-code-acp (adaptateur Zed)
# n'expose que default/sonnet/opus/haiku — les variantes Fable restent
# sélectionnables en les déclarant ici (session/set_model accepte la
# valeur telle quelle ; les ids complets claude-fable-5 / claude-fable-5-1
# passent aussi). `label` = libellé affiché dans le sélecteur.
# extra_models = [
#   { value = "fable", label = "Fable" },
#   { value = "fable[1m]", label = "Fable 1M" },
# ]
#
# Advisor (outil de consultation facturé en crédits d'usage — la valeur
# doit être « au moins aussi capable » que le modèle de base, sinon
# Claude la refuse ; certains modèles de base exigent en plus
# CLAUDE_CODE_ENABLE_EXPERIMENTAL_ADVISOR_TOOL=1 dans [agents.claude.env]) :
# `advisor_models` affiche un sélecteur par session ; la valeur est
# injectée au spawn via `_meta.claudeCode.options` — mécanisme propre à
# l'adaptateur @zed-industries/claude-code-acp — l'adaptateur officiel
# @agentclientprotocol/claude-agent-acp ne le connaît pas). "off" est
# toujours proposé (désactive explicitement). Changer de valeur recycle
# le process agent. Sans clé : aucun sélecteur.
# advisor_models = ["fable", "opus", "sonnet"]

# Exemples d'autres agents ACP (adapter la commande) :
# [agents.gemini]
# name = "Gemini CLI"
# command = ["gemini", "--experimental-acp"]
