# Configuration agentcontrol-daemon — ~/.agentcontrol/config.toml

# Loopback-only TCP listener (the client tunnels to it via ssh -L). The
# daemon refuses to start on another address unless
# `allow_non_loopback_tcp = true` — network exposure would give anyone on
# the network control of the agents.
# Every TCP connection authenticates on its first line with the
# <root>/daemon.token token (generated on first start, mode 0600) —
# loopback alone is not per-user isolation (other local account,
# forwarded port). Rotation: `acctl token rotate` (revokes open TCP
# connections). The unix socket (mode 0600) and the web UI (web.token)
# have their own trust.
bind_tcp = "127.0.0.1:7331"
# Explicit escape hatch for the loopback guard (isolated private network,
# container): the bind is accepted off-loopback, a warn is logged at every
# start, and daemon.token auth still applies to every TCP connection.
# allow_non_loopback_tcp = false

# Interface web : le démon sert la même SPA que le client Tauri — sessions,
# chat live (WebSocket), fichiers, terminal, téléchargements. Loopback
# obligatoire : l'accès distant passe par un tunnel SSH
# (`ssh -N -L <port local>:127.0.0.1:<bind_http> hôte`). Le token d'accès est
# généré dans <root>/web.token (l'URL complète est donnée par `acctl status`).
# bind_http = "127.0.0.1:7332"
# Dossier des assets SPA — défaut : embarqués dans le binaire, puis
# <root>/web, <exe>/web. Utile en dev (`client/dist`) ou install manuelle.
# web_dir = "/chemin/vers/dist"

# Reprise auto après un arrêt brutal (crash, SIGKILL, OOM) : les sessions
# qui travaillaient sont relancées (session/load) et reçoivent un prompt
# "continue please". Les sessions idle ne sont jamais relancées. Un arrêt
# propre (SIGTERM/SIGINT) ne déclenche pas de reprise au boot suivant.
auto_resume = true

# ---------------------------------------------------------------------------
# Skills agents embarqués (acctl, ac-wait, ac-steps…) : compilés dans le
# binaire, le démon les synchronise dans les répertoires que chaque
# provider scanne — .devin/skills (devin), .claude/skills (claude),
# .agents/skills + .cursor/skills (cursor), .agents/skills (codex et
# profils inconnus) — dans le cwd de chaque session, à chaque spawn et
# une fois au boot. Rien à copier : une install fraîche expose les skills
# partout.
#
# La sync est gérée : un manifeste .agentcontrol-skills.json par
# répertoire suit les fichiers posés ; le contenu est réécrit quand la
# version embarquée change (upgrade du démon = skills à jour). Un
# répertoire de skill déjà présent SANS manifeste n'est jamais écrasé :
# adopté s'il est identique au contenu embarqué, sinon ignoré avec un
# warn dans le log — pour garder votre propre version d'un skill fourni,
# renommez-le ou supprimez-le (la version embarquée prendra le nom).
# Dans un repo git, le démon ajoute lui-même les racines provisionnées
# au .git/info/exclude du dépôt (commondir — partagé entre worktrees) :
# git status reste propre sans toucher à votre .gitignore. Rien n'est
# ajouté si le dossier de skills est déjà suivi par git (repo qui
# versionne ses skills).
#
# Désactiver globalement : provision_skills = false
# Désactiver pour un seul profil : [agents.<id>] provision_skills = false
#
# Skills personnalisés : un skill à vous dans <cwd>/.devin/skills/ (ou
# l'équivalent du provider) n'est jamais écrasé tant que son nom ne
# percute pas un skill embarqué. Pour qu'un skill soit embarqué dans le
# démon (distribué à toutes les installs), l'ajouter dans le repo
# AgentControl sous skills/<nom>/SKILL.md — voir AGENTS.md.
# ---------------------------------------------------------------------------
# provision_skills = true

# ---------------------------------------------------------------------------
# Rétention / stockage — un janitor applique ces limites périodiquement.
# ---------------------------------------------------------------------------
[retention]
# events.jsonl compacté au-delà de ce seuil (la queue est conservée)
journal_max_mb = 64
journal_keep_mb = 32
# Quota de blobs par session : les plus anciens sont supprimés (LRU)
blob_max_mb = 512
# Purge les sessions inactives (agent mort) sans event depuis N jours. 0 = off
purge_days = 0
# Période du janitor (secondes, min 30)
interval_secs = 600

# ---------------------------------------------------------------------------
# Communication agent↔agent — chaque session reçoit un serveur MCP
# "agentcontrol" (tools: list_sessions / send_message / create_session /
# read_events) et l'env AGENTCONTROL_SOCK + AGENTCONTROL_SESSION (fallback
# via `acctl msg` / `acctl spawn`).
# Un message vers une session morte la relance automatiquement.
# ---------------------------------------------------------------------------
[a2a]
enabled = true
# Max messages par minute et par paire émetteur→cible (anti-boucle, 0 = illimité)
rate_per_min = 20
# Max sessions créées par minute et par session créatrice
# (agentcontrol_create_session — 0 = illimité, comme rate_per_min)
spawn_per_min = 10
# Max sessions agent→agent existantes au total (vivantes ou mortes) —
# borne le fan-out récursif (chaque fille est une créatrice).
# 0 = spawn agent→agent interdit.
spawn_max_sessions = 20

# ---------------------------------------------------------------------------
# Agents ACP. Les placeholders {model} et {mode} sont substitués à la création
# de session (omis si vides).
#
# Auto-découverte : le démon sonde le PATH à chaque list_agents /
# daemon_status / spawn et enregistre seul les adaptateurs ACP connus
# (claude via `acp-claude`, codex via `codex-acp`, gemini, opencode) —
# profils marqués `via: "auto"` dans list_agents, sans restart ni
# déclaration. Un profil `[agents.*]` déclaré ICI prime toujours sur
# l'auto-détection (même id → la config gagne). Quand l'outil est
# installé mais pas l'adaptateur (ex. CLI `claude` sans `acp-claude`),
# le profil apparaît indisponible avec le motif + le hint d'install.
#
# `command` accepte aussi des fallbacks : une liste de commandes
# candidates essayées dans l'ordre, la première dont le binaire
# (argv[0]) résout sur le PATH gagne — ex.
#   command = [["mon-adaptateur"], ["mon-adaptateur", "--acp"]]
#
# Les sections [agents.*] sont rechargées À CHAUD : une section ajoutée ou
# modifiée dans ce fichier est prise en compte au prochain list_agents /
# daemon_status / spawn, sans redémarrer le démon (upsert seul — retirer
# une section ne démonte pas le profil avant le prochain boot). Les autres
# sections de la config restent lues au démarrage uniquement.
# ---------------------------------------------------------------------------

[agents.devin]
name = "Devin CLI"
command = ["devin", "acp"]

# Variantes modèle hors annonce ACP (ex. swe-2-flash-max que Devin
# n'expose pas dans config_options) : le preset built-in déclare déjà
# `catalogue_cmd` (sonde `devin models list`, cache ~1 h) +
# `model_override_cmd` (persiste la valeur dans le store provider
# entre le kill de l'agent ACP et le session/load — {native_sid} et
# {model} substitués pré-quotés, exécuté via sh -c) + un repli statique
# `extra_models`. ⚠️ Une section [agents.devin] écrite ici REMPLACE le
# preset entier : pour garder le catalogue il faut y redéclarer les
# trois clés ci-dessous (`devin -r` sort 1 sur stdout non-TTY une fois
# le modèle persisté — la tolérance `|| test $? -eq 1` évite un faux
# échec).
catalogue_cmd = "devin models list"
model_override_cmd = "devin -r {native_sid} --model {model} --respect-workspace-trust false || test $? -eq 1"
# Repli statique du preset — servi quand `devin models list` échoue
# (CLI trop vieux) et fusionné au catalogue sinon (dédoublonné par
# valeur).
extra_models = [
  { value = "adaptive", label = "Adaptive" },
  { value = "swe-2-max", label = "SWE-2 Max" },
  { value = "swe-2-high", label = "SWE-2 High" },
  { value = "swe-2-medium", label = "SWE-2 Medium" },
  { value = "swe-2-max-lightning", label = "SWE-2 Max Lightning" },
  { value = "swe-2-high-lightning", label = "SWE-2 High Lightning" },
  { value = "swe-2-medium-lightning", label = "SWE-2 Medium Lightning" },
  { value = "swe-2-flash-max", label = "SWE-2 Flash Max" },
  { value = "swe-2-flash-high", label = "SWE-2 Flash High" },
  { value = "swe-2-flash-medium", label = "SWE-2 Flash Medium" },
  { value = "swe-2-flash-max-lightning", label = "SWE-2 Flash Max Lightning" },
  { value = "swe-2-flash-high-lightning", label = "SWE-2 Flash High Lightning" },
  { value = "swe-2-flash-medium-lightning", label = "SWE-2 Flash Medium Lightning" },
]

# DEVIN_PERMISSION_MODE est lue par le CLI au démarrage ; DEVIN_MODEL
# (preset built-in, "{model}") pose le modèle demandé à la création de
# session — redéclaré ici pour les mêmes raisons.
[agents.devin.env]
DEVIN_PERMISSION_MODE = "{mode}"
DEVIN_MODEL = "{model}"

# Cursor CLI — ACP natif, preset BUILT-IN (id `cursor`, affiché dans le
# sélecteur de session sans rien déclarer ici). argv[0] est résolu sur
# le PATH au boot (`cursor-agent` puis l'alias `agent`) en chemin
# absolu, puis re-résolu à chaud à chaque `available`/spawn — une
# install postérieure au démarrage du démon est détectée sans restart.
# Login préalable : `cursor-agent login` (ou `agent login`).
# Le mode/modèle demandés à la création sont appliqués via ACP après
# session/new (pas de placeholder).
# Surcharger la commande sans éditer ce fichier : options →
# composants → « agents » (ou `acctl comp set agents cursor
# "agent,acp"`) — persisté ici en `[agents.cursor]` complet.
# [agents.cursor]
# name = "Cursor CLI"
# command = ["agent", "acp"]

# Codex CLI — pas d'ACP natif : via l'adaptateur officiel
# `npm i -g @agentclientprotocol/codex-acp` (repo zed-industries archivé,
# développement déplacé vers agentclientprotocol). Le CLI `codex`
# seul ne parle PAS ACP — installer codex sans l'adaptateur laisse le
# profil indisponible (auto-découverte : `codex` détecté → profil
# « Codex CLI » grisé + hint d'install). Sans déclaration, le profil
# `codex` est de toute façon auto-enregistré dès que `codex-acp`
# est sur le PATH — cette section ne sert qu'à surcharger
# (name/env/max_instances…). Nécessite node sur le
# PATH du démon (ensure_agent_path couvre les dossiers agents usuels :
# ~/.local/bin, ~/.npm-global/bin, shims mise, cargo, nvm…).
# CODEX_PATH doit pointer le binaire codex installé : sans lui,
# l'adaptateur lance son @openai/codex npm embarqué (et sous npx,
# "codex" dans PATH serait le wrapper npm, pas le vrai CLI).
[agents.codex]
name = "Codex CLI"
command = ["codex-acp"]

[agents.codex.env]
# CODEX_PATH = "/chemin/absolu/vers/codex" # adapter : chemin absolu du codex standalone

# Claude — adaptateur maison `acp-claude`, livré dans le tarball à
# côté du démon (et posé par daemon-update) : aucun npm requis, le
# profil `claude` s'auto-enregistre dès que `acp-claude` ET le CLI
# `claude` (installeur natif → ~/.local/bin/claude) sont sur le PATH.
# `acp-claude` absent → profil grisé avec le hint « mettre à jour le
# démon » — les adaptateurs npm historiques (claude-code-acp /
# claude-agent-acp) ne sont plus essayés automatiquement (#285), mais
# un [agents.claude] déclaré à la main peut toujours les viser
# explicitement (ex. pour l'advisor `_meta.claudeCode.options`, voir
# plus bas). Déclarer [agents.claude] prime sur l'auto (env,
# extra_models, max_instances…).
# Auth requise — l'une des deux variables ci-dessous, ou OAuth existant
# dans ~/.claude :
#   - ANTHROPIC_API_KEY (facturation API)
#   - CLAUDE_CODE_OAUTH_TOKEN : `npm i -g @anthropic-ai/claude-code`
#     puis `claude setup-token` (marche en headless : URL → code).
# [agents.claude]
# name = "Claude"
# command = ["acp-claude"]

# [agents.claude.env]
# CLAUDE_CODE_OAUTH_TOKEN = "…"

# Modèles « extra » hors annonce ACP : fusionnés dans la liste
# affichée quand l'adaptateur ne les annonce pas (session/set_model
# accepte la valeur telle quelle ; les ids complets claude-fable-5 /
# claude-fable-5-1 passent aussi). `label` = libellé affiché dans le
# sélecteur.
# extra_models = [
#   { value = "fable", label = "Fable" },
#   { value = "fable[1m]", label = "Fable 1M" },
# ]
#
# Advisor (outil de consultation facturé en crédits d'usage — la valeur
# doit être « au moins aussi capable » que le modèle de base, sinon
# Claude la refuse ; certains modèles de base exigent en plus
# CLAUDE_CODE_ENABLE_EXPERIMENTAL_ADVISOR_TOOL=1 dans [agents.claude.env]) :
# `advisor_models` affiche un sélecteur par session ; la valeur est
# injectée au spawn via `_meta.claudeCode.options` — mécanisme de
# l'adaptateur @zed-industries/claude-code-acp, que `acp-claude`
# n'implémente pas : pour l'utiliser, déclarer [agents.claude] avec
# `command = ["claude-code-acp"]` (npm i -g @zed-industries/claude-code-acp)
# — l'adaptateur officiel @agentclientprotocol/claude-agent-acp ne le
# connaît pas non plus. "off" est toujours proposé (désactive
# explicitement). Changer de valeur recycle le process agent. Sans
# clé : aucun sélecteur.
# advisor_models = ["fable", "opus", "sonnet"]

# Exemples d'autres agents ACP (adapter la commande) :
# [agents.gemini]
# name = "Gemini CLI"
# command = ["gemini", "--experimental-acp"]

# ---------------------------------------------------------------------------
# Catalogue de composants — overrides [catalog.<name>] par entrée embarquée
# (noms connus au boot : agentbacklog, agentreviewer…). Repointer la source
# d'install/métadonnées vers un fork, un miroir ou un chemin local sans
# recompiler le démon. Noms ou clés de params inconnus → warn au démarrage,
# ignorés.
#
#   repo      — dépôt upstream sondé pour latest_version (format
#               "owner/name", sonde API GitHub) ; homepage dérivée si absente.
#   homepage  — URL de documentation affichée par le client.
#   params    — défauts des paramètres déclarés de l'entrée ; la valeur
#               fournie à l'install (dialogue, component_install --set)
#               prime toujours sur ces défauts.
#
# `install_spec` (entrées installées via `uv tool install`) accepte un nom
# de paquet d'index, un `git+<url>` ou un chemin local — ex. :
# [catalog.agentbacklog]
# repo = "acme/AgentBacklog"
# params.install_spec = "git+https://git.acme.corp/AgentBacklog"
#
# [catalog.agentreviewer]
# params.install_spec = "/opt/checkouts/agentreviewer"
# ---------------------------------------------------------------------------
