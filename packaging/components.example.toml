# Declared components — <AGENTCONTROL_HOME>/components.toml
#
# This file is OWNED by the daemon: it is atomically rewritten by the
# editing RPCs (component_upsert / component_remove /
# component_install). Hand-editing it only makes sense to seed specs
# before the first start — for hot edits, go through the RPCs
# (eventually `acctl comp edit`, see docs/components-integration.md).
#
# `~`/`~/…` at the head of a path field is expanded under the daemon's
# HOME at load time — the persisted spec carries absolute paths.
#
# Full reference of kinds/fields: docs/components-integration.md §2.1.

# ---------------------------------------------------------------------------
# agentreviewer — typical use case: a watcher that used to live under
# supervisord moves under the daemon's lifecycle (start/stop/restart,
# healthcheck, paged logs via component_logs).
# NB: "backlog-orchestrator" is a RESERVED name (native internal
# component) — upsert/install on it fails; its supervisord → internal
# migration is in packaging/INSTALL.md §5.
# ---------------------------------------------------------------------------
[[components]]
name = "agentreviewer"
kind = "process"                    # internal | process | external | tool
command = ["~/.local/bin/agent-reviewer", "--watch"]
cwd = "~"                           # default: <AGENTCONTROL_HOME>
autostart = true
restart = "on-failure"              # always | on-failure | never
restart_sec = 5                     # base backoff (×2, cap 60 s)
healthcheck = { kind = "process" }  # none | process | tcp | http | command
description = "Review watcher driving this daemon"

# Additional env (optional). AGENTCONTROL_SOCK/TCP/HOME/COMPONENT are
# injected by the daemon anyway and OVERRIDE this block — a component
# cannot lie about its daemon's address.
[components.env]
AGENTCONTROL_TCP = "127.0.0.1:7331"  # informational — overwritten by injection

