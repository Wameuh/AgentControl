# Composants déclarés — <AGENTCONTROL_HOME>/components.toml
#
# Ce fichier est POSSÉDÉ par le démon : il est réécrit atomiquement par
# les RPC d'édition (component_upsert / component_remove /
# component_install). Le modifier à la main ne sert qu'à semer des specs
# avant le premier démarrage — pour éditer à chaud, passer par les RPC
# (à terme `acctl comp edit`, cf docs/components-integration.md).
#
# `~`/`~/…` en tête d'un champ chemin est expansé sous le HOME du démon
# au chargement — la spec persistée porte des chemins absolus.
#
# Référence complète des kinds/champs : docs/components-integration.md §2.1.

# ---------------------------------------------------------------------------
# agentreviewer — cas d'usage typique : un watcher qui vivait sous
# supervisord passe sous le cycle de vie du démon (start/stop/restart,
# healthcheck, logs paginés via component_logs).
# NB : « backlog-orchestrator » est un nom RÉSERVÉ (composant internal
# natif) — upsert/install dessus échoue ; sa migration supervisord →
# interne est dans packaging/INSTALL.md §5.
# ---------------------------------------------------------------------------
[[components]]
name = "agentreviewer"
kind = "process"                    # internal | process | external | tool
command = ["~/.local/bin/agent-reviewer", "--watch"]
cwd = "~"                           # défaut : <AGENTCONTROL_HOME>
autostart = true
restart = "on-failure"              # always | on-failure | never
restart_sec = 5                     # backoff de base (×2, cap 60 s)
healthcheck = { kind = "process" }  # none | process | tcp | http | command
description = "Watcher de review pilotant ce démon"

# Env additionnelle (facultatif). AGENTCONTROL_SOCK/TCP/HOME/COMPONENT
# sont de toute façon injectées par le démon et PRIMENT sur ce bloc — un
# composant ne peut pas mentir sur l'adresse de son démon.
[components.env]
AGENTCONTROL_TCP = "127.0.0.1:7331"  # informatif — écrasé par l'injection

# ---------------------------------------------------------------------------
# agentbacklog — kind `tool` : CLI stateless, pas de process long. Sa
# commande sert de sonde de présence/version (exécutée ~30 s).
