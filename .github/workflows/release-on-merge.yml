name: release-on-merge

# Release automatique pilotée par label :
#   label `release` sur une PR → au merge sur main, tag vX.Y.Z créé
#   puis build.yml dispatché sur le tag (un push de tag via GITHUB_TOKEN
#   ne déclenche PAS les workflows → dispatch explicite).
#   Idempotent : si le tag v<version> existe déjà → skip (version non
#   bumpée = rien à releaser).
#
#   label `sync` → voir version.yml : bump minor (client+daemon doivent
#   être déployés ensemble ; déclenche l'auto-update des démons).

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read
  actions: write

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Labels de la PR mergée
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LABELS=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '[.[].labels[].name] | join(",")')
          echo "labels=$LABELS" >> "$GITHUB_OUTPUT"
          echo "merged PR labels: '$LABELS'"

      - name: Tag + dispatch release
        if: contains(steps.pr.outputs.labels, 'release')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION=$(grep -oE '"version": "[^"]+"' client/package.json | head -1 | cut -d'"' -f4)
          git fetch --tags -q
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "tag v$VERSION existe déjà (version non bumpée ?) → skip"
            exit 0
          fi
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh workflow run build.yml --ref "v$VERSION"
          echo "Release v$VERSION déclenchée (build sur le tag)"
