name: release-on-merge

# Release automatique pilotée par le merge de la release PR :
#   une PR head=next_release mergée sur main → tag vX.Y.Z créé
#   puis build.yml dispatché sur le tag (un push de tag via GITHUB_TOKEN
#   ne déclenche PAS les workflows → dispatch explicite).
#   Idempotent : si le tag v<version> existe déjà → skip (version non
#   bumpée = rien à releaser).
#
#   Le bump lui-même est fait en amont par le job `release-bump` de
#   version.yml sur la PR de release (niveau = mots-clés `(major)` /
#   `(minor)` / `(sync)` dans les commits du cycle → cf. version.yml).

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read
  actions: write

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Branche head de la PR mergée
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IS_RELEASE=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '[.[] | select(.head.repo.fork == false) | .head.ref] | index("next_release") != null')
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"
          echo "release PR merged: $IS_RELEASE"

      - name: Tag + dispatch release
        if: steps.pr.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION=$(grep -oE '"version": "[^"]+"' client/package.json | head -1 | cut -d'"' -f4)
          git fetch --tags -q
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "tag v$VERSION existe déjà (version non bumpée ?) → skip"
            exit 0
          fi
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh workflow run build.yml --ref "v$VERSION"
          echo "Release v$VERSION déclenchée (build sur le tag)"

      # Les releases/tags vX.Y.Z-rc.* du cycle sont obsolètes une fois la
      # finale publiée — on les retire (release + tag) pour garder la
      # page releases propre. Fail-safe : un échec de cleanup ne casse
      # jamais la release.
      - name: Cleanup des RC du cycle
        if: steps.pr.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -oE '"version": "[^"]+"' client/package.json | head -1 | cut -d'"' -f4)
          git fetch --tags -q
          for t in $(git tag -l "v$VERSION-rc.*"); do
            echo "cleanup $t"
            gh release delete "$t" --yes --cleanup-tag 2>/dev/null \
              || git push origin ":refs/tags/$t" || true
          done
