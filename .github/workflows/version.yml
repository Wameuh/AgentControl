name: version

# Bump de version au moment de la release (PR next_release -> main
# passee non-draft) :
#   NEXT = dernier tag v* semver + niveau
#   niveau = mot-clef le plus fort trouve dans les sujets/bodies des
#            commits du cycle : `(major)` > `(minor)` | `(sync)` ;
#            aucun -> patch.
#   Plage : depuis le dernier bump DEJA RELEASE = dernier commit
#   `chore: bump version` dont la version a son tag vX.Y.Z — le bump
#   du cycle courant (tag pas encore cree) est saute, la plage couvre
#   le cycle entier meme sur re-run (synchronize post-bump).
#   Borne nominale post-reset : reconcile remet nr = tip main → nr
#   n'a plus de commit `chore: bump version` → le grep ne trouve rien
#   → fallback = dernier tag semver, ancetre de nr → v<tag>..HEAD =
#   commits du cycle. Avant le reset (historique nr autonome) le tag
#   ne pouvait PAS servir de borne : jamais ancetre des commits nr
#   sous squash -> rescan infini de l'historique publie ; d'ou le
#   double chemin : commit bump tague d'abord, dernier tag ensuite.
#   Les mots-clefs survivent au squash : le message de squash reprend
#   les sujets des commits dans le body -> ecrire le mot-clef
#   parenthese dans le sujet (ex. `feat: multi-agents (minor)`).
#   Le bump est commit + push sur next_release par le workflow via le
#   secret RELEASE_PAT (PAT fine-grained du repo, Contents RW +
#   Workflows RW — Workflows exige par reconcile, qui importe des
#   historiques touchant .github/workflows) : les rulesets ne peuvent
#   pas bypasser github-actions[bot] (422 : app first-party non
#   installable) ET un push GITHUB_TOKEN ne declencherait pas les
#   checks sur le head bumpe (anti-recursion) — le PAT resout les deux
#   (le role `Repository admin` est en bypass actor du ruleset).
#   Idempotent : package.json deja a NEXT -> skip.
# Draft : pas de bump — le job repart au passage en ready_for_review.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Plancher moindre privilège : GITHUB_TOKEN en read partout — les
# pushes partent via le PAT du checkout (RELEASE_PAT), jamais via
# GITHUB_TOKEN.
permissions:
  contents: read

# Deux events proches (ready_for_review + synchronize après le push du
# bump…) → deux jobs concurrents : le second push est non-fast-forward
# → échec. cancel-in-progress=true : le run le plus récent gagne.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-bump:
    # Uniquement la PR de release : base=main, head=next_release,
    # non-draft, non-fork (GITHUB_TOKEN read-only sur fork).
    # Le passage en ready EST le declencheur de release — pas de label.
    if: >-
      github.event.pull_request.base.ref == 'main'
      && github.event.pull_request.head.ref == 'next_release'
      && github.event.pull_request.draft != true
      && github.event.pull_request.head.repo.fork == false
    # contents: write inutile : le push part en PAT (checkout token) ;
    # le fallback github.token n'atteint jamais le push (guard avant).
    permissions:
      contents: read
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # Push via PAT : bypass ruleset (role admin) + les events
          # push déclenchent les checks (GITHUB_TOKEN ne le ferait pas).
          token: ${{ secrets.RELEASE_PAT || github.token }}

      - name: Bump depuis le dernier tag + mots-clés des commits
        id: bump
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -e
          git fetch --tags -q origin
          # Borne du scan = dernier bump DEJA RELEASE : iterer les
          # commits `chore: bump version`, extraire X.Y.Z du sujet,
          # retenir le premier dont le tag vX.Y.Z existe — le bump que
          # ce job vient de pousser (tag pas encore cree) est saute →
          # la plage couvre le cycle complet meme sur re-run.
          BOUND=""
          for c in $(git rev-list --grep='^chore: bump version' HEAD); do
            v=$(git log -1 --format=%s "$c" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | tail -1)
            if [ -n "$v" ] && git rev-parse -q --verify "refs/tags/v$v" >/dev/null 2>&1; then
              BOUND=$c; break
            fi
          done
          [ -z "$BOUND" ] && BOUND=$(git tag -l 'v*' --sort=-version:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          RANGE="HEAD"
          [ -n "$BOUND" ] && RANGE="$BOUND..HEAD"
          echo "borne: ${BOUND:-racine}"
          # Convention : mot-clef parenthese `(minor)`/`(major)`/`(sync)`
          # — jamais un mot nu (`a major bug`, `sync retry` en prose ne
          # doivent pas compter).
          MSGS=$(git log --format=%B "$RANGE")
          if   echo "$MSGS" | grep -qiE '\(major\)';        then LEVEL=major
          elif echo "$MSGS" | grep -qiE '\((minor|sync)\)'; then LEVEL=minor
          else LEVEL=patch
          fi
          # Numero de release = dernier tag semver + niveau (jamais
          # package.json, qui derive entre releases).
          LAST=$(git tag -l 'v*' --sort=-version:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          echo "dernier tag: ${LAST:-aucun}"
          if [ -n "$LAST" ]; then
            IFS=. read -r MA MI PA <<< "${LAST#v}"
          else
            CURPKG=$(grep -oE '"version": "[^"]+"' client/package.json | head -1 | cut -d'"' -f4)
            IFS=. read -r MA MI PA <<< "$CURPKG"
          fi
          case $LEVEL in
            major) NEXT="$((MA+1)).0.0" ;;
            minor) NEXT="$MA.$((MI+1)).0" ;;
            patch) NEXT="$MA.$MI.$((PA+1))" ;;
          esac
          CUR=$(grep -oE '"version": "[^"]+"' client/package.json | head -1 | cut -d'"' -f4)
          echo "last=${LAST:-none} cur=$CUR level=$LEVEL next=$NEXT"
          # `next` alimente aussi le tag RC (step suivant) — posé même
          # quand le bump est sauté (déjà à NEXT).
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          if [ "$CUR" = "$NEXT" ]; then
            echo "package.json déjà à $NEXT → skip"
            exit 0
          fi
          # Durcissement : exécuter le script de la BASE, pas celui de
          # la PR — le PAT du checkout est persisté dans la config git
          # (persist-credentials) → tout code de PR dans ce step
          # pourrait pusher avec. ROOT du script dépend de __file__ →
          # extraire dans le tree puis restaurer.
          git show "origin/$BASE_REF:client/tools/bump_version.py" > client/tools/bump_version.py
          python3 client/tools/bump_version.py "$NEXT"
          git checkout HEAD -- client/tools/bump_version.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Pas de mot-clef dans le message (il rentrerait dans la
          # plage du cycle suivant) — le niveau reste lisible ci-dessus.
          git commit -am "chore: bump version to $NEXT"
          echo "bumped=true" >> "$GITHUB_OUTPUT"

      # Guard dédié, seulement si un push est nécessaire (déjà bumpé →
      # sortie clean sans exiger le secret). Le PAT n'est jamais dans
      # l'env du step métier (ni dans bump_version.py).
      - name: Guard RELEASE_PAT
        if: steps.bump.outputs.bumped == 'true'
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: '[ -n "$RELEASE_PAT" ] || { echo "::error::secret RELEASE_PAT manquant"; exit 1; }'

      - name: Push du bump sur next_release
        if: steps.bump.outputs.bumped == 'true'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: git push origin "HEAD:$HEAD_REF"

      # Release candidate : chaque état « prêt » de next_release est
      # tagué v<NEXT>-rc.<k> → le push du tag via PAT déclenche
      # build.yml (`push: tags v*`) → prérelease publiée, installable
      # via l'auto-update (canal rc opt-in des paramètres) pour tester
      # avant le merge. Idempotent par sha : le synchronize du push de
      # bump et les re-runs ne re-tagguent pas le même head ; un
      # synchronize post-ready (nouveaux commits mergés sur nr) produit
      # rc.<k+1> sur le nouveau head. Le tag porte le commit bumpé
      # (HEAD local = head pushé, ou checkout quand le bump est sauté).
      - name: Tag RC v<NEXT>-rc.<k>
        env:
          NEXT: ${{ steps.bump.outputs.next }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          [ -n "$NEXT" ] || { echo "NEXT absent → skip"; exit 0; }
          git fetch --tags -q origin
          SHA=$(git rev-parse HEAD)
          if git tag -l "v$NEXT-rc.*" --points-at "$SHA" | grep -q .; then
            echo "$SHA déjà tagué rc → skip"; exit 0
          fi
          # Head nr déplacé depuis le trigger (run stale encore vivant)
          # → le run du nouveau head tagguera ; pas de rc sur un sha
          # dépassé (l'api peut échouer → on tague quand même).
          CUR=$(gh api "repos/${{ github.repository }}/git/ref/heads/next_release" \
            --jq .object.sha 2>/dev/null || echo "")
          if [ -n "$CUR" ] && [ "$CUR" != "$SHA" ]; then
            echo "head nr déplacé ($CUR ≠ $SHA) → skip"
            exit 0
          fi
          ESC=${NEXT//./\\.}
          LAST=$(git tag -l "v$NEXT-rc.*" \
            | sed -n "s/^v$ESC-rc\.\([0-9][0-9]*\)$/\1/p" | sort -n | tail -1)
          TAG="v$NEXT-rc.$((${LAST:-0} + 1))"
          git tag "$TAG"
          if ! git push origin "$TAG" 2>/dev/null; then
            # Course avec un run concurrent : déjà créé ailleurs = OK.
            git fetch --tags -q origin
            git rev-parse -q --verify "refs/tags/$TAG" >/dev/null \
              && echo "tag $TAG créé par un run concurrent" \
              || { echo "::error::push du tag $TAG refusé"; exit 1; }
          fi
          echo "RC $TAG poussé → build déclenché par le tag"
