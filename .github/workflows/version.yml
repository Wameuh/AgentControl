name: version

# Bump de version automatique piloté par les labels de la PR :
#   daemon / client → patch   (déclare les composants touchés)
#   patch / minor / major     → niveau explicite (prioritaire)
#   aucun label composante    → pas de bump (docs, CI, tests)
# Idempotent : si la branche a déjà une version différente de base, skip.

on:
  pull_request:
    types: [opened, synchronize, labeled]

permissions:
  contents: write
  pull-requests: read

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Bump selon les labels
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels) }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -e
          LABELS=$(echo "$PR_LABELS" | grep -o '"name":"[^"]*"' | cut -d'"' -f4 | tr '\n' ' ')
          echo "labels: $LABELS"
          case " $LABELS " in
            *" major "*) LEVEL=major ;;
            *" minor "*) LEVEL=minor ;;
            *" patch "*) LEVEL=patch ;;
            *" daemon "*|*" client "*) LEVEL=patch ;;
            *) echo "pas de label daemon/client → pas de bump"; exit 0 ;;
          esac
          BASEV=$(git show "origin/$BASE_REF:client/package.json" | grep -oE '"version": "[^"]+"' | head -1 | cut -d'"' -f4)
          HEADV=$(grep -oE '"version": "[^"]+"' client/package.json | head -1 | cut -d'"' -f4)
          echo "base=$BASEV head=$HEADV level=$LEVEL"
          if [ "$HEADV" != "$BASEV" ]; then
            echo "version déjà bumpée sur la branche → skip"
            exit 0
          fi
          python3 client/tools/bump_version.py "$LEVEL"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump version ($LEVEL)"
          git push origin "HEAD:$HEAD_REF"
