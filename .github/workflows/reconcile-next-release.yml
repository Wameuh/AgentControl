name: reconcile-next-release

# Réconciliation post-release : chaque merge nr -> main est un squash
# (commit sans lien d'ancêtre avec les commits nr) → sans reconcile,
# la merge-base nr/main reste figée avant le cycle et la prochaine PR
# de release reconflicte dès que les deux côtés ont touché les mêmes
# lignes (arrivé sur #23, #29). Les commits nr ne devenant jamais
# ancêtres de main, la release PR les liste TOUS (#39 : 25 commits
# remontant à #11) et le réglage repo `squash_merge_commit_message:
# COMMIT_MESSAGES` les injecte dans le message de merge.
#
# Ici, deux modes après chaque push sur main :
#
# 1. Arbres identiques (cas nominal post-release : nr n'a aucun
#    contenu hors de main — ses commits sont déjà publiés dans le
#    squash) → RESET : nr est réécrite sur le tip main
#    (force-with-lease). Les commits du cycle écoulé quittent nr →
#    la prochaine release PR ne liste que le cycle courant, et la
#    merge-base = tip main → plus jamais de conflit.
#
# 2. Arbres différents (nr porte du travail hors de main : feature
#    mergée dans la fenêtre du reconcile, résolutions de conflit
#    côté main, ou hotfix direct sur main en cours de cycle) →
#    MERGE classique (parents = nr tip + main tip, vrai merge
#    récursif, pas `-s ours`) : un hotfix poussé sur main est
#    propagé dans nr ; si ça conflict le job échoue (fail-closed —
#    résolution manuelle requise, jamais de perte silencieuse).
#
# Conséquences du reset : nr est réécrite après chaque release →
# clones locaux à `git reset --hard origin/next_release` (pas pull)
# et PR ouverte basée sur l'ancien nr à `git rebase --onto
# origin/next_release <ancien-tip>` (sinon sa liste de commits
# affiche l'ancien historique ; le diff reste correct).
#
# Push via secret RELEASE_PAT (PAT fine-grained, Contents RW +
# Workflows RW — Workflows OBLIGATOIRE pour le mode merge : il
# importe dans nr des squashs main touchant .github/workflows, et
# GitHub refuse un push PAT qui crée/modifie des workflows sans le
# scope) : le ruleset ne peut pas bypasser github-actions[bot]
# (app first-party, 422) et un push GITHUB_TOKEN ne déclencherait
# pas les checks — le PAT couvre les deux (bypass actor : role
# `Repository admin` — couvre aussi le non_fast_forward du reset).

on:
  push:
    branches: [main]

# contents: write inutile : le push part en PAT (checkout token) ;
# le fallback github.token n'atteint jamais le push (guard avant).
permissions:
  contents: read

concurrency:
  group: reconcile-next-release
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || github.token }}

      - name: Reset ou merge de next_release sur main
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          set -e
          git fetch origin next_release main
          # main déjà ancêtre de nr (rien mergé depuis le dernier
          # reconcile) → rien à faire — sortie avant le check PAT :
          # secret absent ≠ échec quand aucun push n'est nécessaire.
          if git merge-base --is-ancestor origin/main origin/next_release; then
            echo "next_release contient déjà main → skip"
            exit 0
          fi
          [ -n "$RELEASE_PAT" ] || { echo "::error::secret RELEASE_PAT manquant"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet origin/main origin/next_release; then
            # Arbres identiques → reset sans perte de contenu : tous
            # les commits nr sont déjà publiés (squash release), seul
            # leur historique est abandonné. On pousse `origin/main` —
            # la référence qu'on vient d'évaluer, pas HEAD (github.sha,
            # figé au trigger, peut être périmé sur re-run ou si main a
            # bougé). Le lease ancre la réécriture sur le nr évalué :
            # si nr a bougé entre le fetch et le push → refus → rouge.
            echo "arbres identiques → reset next_release sur main"
            git push --force-with-lease=refs/heads/next_release \
              origin origin/main:refs/heads/next_release
          else
            # nr a du contenu hors de main → merge réconcilié,
            # jamais de reset destructif.
            echo "nr contient du travail absent de main → merge reconcile"
            git checkout -B next_release origin/next_release
            git merge --no-ff origin/main \
              -m "merge: reconcile main into next_release after release"
            git push origin next_release
          fi
