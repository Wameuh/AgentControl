name: reconcile-next-release

# Réconciliation post-release : chaque merge nr -> main est un squash
# (commit sans lien d'ancêtre avec les commits nr) → sans reconcile,
# la merge-base nr/main reste figée avant le cycle et la prochaine PR
# de release reconflicte dès que les deux côtés ont touché les mêmes
# lignes (arrivé sur #23, #29).
#
# Ici : après chaque push sur main, merge commit sur next_release
# (parents = nr tip + main tip). main devient ancêtre de nr → la
# merge-base de la prochaine release = le tip main → diff = commits du
# cycle seul → plus jamais de conflit.
#
# Vrai merge récursif (pas `-s ours`) : un hotfix poussé directement
# sur main doit être propagé dans nr ; si ça conflict le job échoue
# (fail-closed — résolution manuelle requise, jamais de perte silencieuse).
#
# Push via secret RELEASE_PAT (PAT fine-grained, Contents RW +
# Workflows RW — OBLIGATOIRE : le merge réconcilié importe dans
# l'historique nr les squashs de main qui touchent .github/workflows,
# et GitHub refuse un push PAT qui crée/modifie des workflows sans le
# scope Workflows) : le ruleset ne peut pas bypasser
# github-actions[bot] (app first-party, 422) et un push GITHUB_TOKEN
# ne déclencherait pas les checks sur le head réconcilié — le PAT
# couvre les deux (bypass actor : role `Repository admin`).

on:
  push:
    branches: [main]

# contents: write inutile : le push part en PAT (checkout token) ;
# le fallback github.token n'atteint jamais le push (guard avant).
permissions:
  contents: read

concurrency:
  group: reconcile-next-release
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || github.token }}

      - name: Merge main into next_release
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          set -e
          git fetch origin next_release
          # main déjà ancêtre de nr (rien mergé depuis le dernier
          # reconcile) → rien à faire — sortie avant le check PAT :
          # secret absent ≠ échec quand aucun push n'est nécessaire.
          if git merge-base --is-ancestor origin/main origin/next_release; then
            echo "next_release contient déjà main → skip"
            exit 0
          fi
          [ -n "$RELEASE_PAT" ] || { echo "::error::secret RELEASE_PAT manquant"; exit 1; }
          git checkout -B next_release origin/next_release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-ff origin/main \
            -m "merge: reconcile main into next_release after release"
          git push origin next_release
