name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  # `ready_for_review` : le pipeline se lance au passage draft → ready.
  # Sur une PR draft, chaque job est skippé (`draft != true`).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Moindre privilège : les jobs de build n'ont besoin que de lire le
# dépôt ; le job `release` porte son propre `contents: write`.
permissions:
  contents: read

# Draft ↔ ready et pushes rapides : annule les runs obsolètes d'une
# même PR (group par ref sur main/tags → pas d'annulation croisée).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------------
  # Démon + outils : Linux x86_64 (le serveur cible)
  # -----------------------------------------------------------------
  daemon-linux:
    if: github.event.pull_request.draft != true
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-musl
    # Nom de check figé : la ruleset next_release exige les contextes
    # « daemon-linux (<os>, <arch>) » — sans `name:` la matrix
    # ajouterait la cible au nom et les required checks ne matchent plus.
    name: daemon-linux (${{ matrix.os }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Tags vX.Y.Z-rc.K : la version buildée porte le suffixe rc (non
      # commité — le tag pointe un commit propre X.Y.Z) → les binaires
      # s'identifient "X.Y.Z-rc.K" : la finale X.Y.Z restera proposée en
      # update (semver : rc < stable) et ensure_daemon matche le tag rc.
      - name: Version RC
        if: contains(github.ref_name, '-rc.')
        run: python3 client/tools/bump_version.py "${GITHUB_REF_NAME#v}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # ring (via rustls/ureq) compile son code C avec cc → les targets
      # *-linux-musl exigent musl-gcc.
      - name: musl-gcc
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
      # Le binaire démon embarque client/dist (build.rs) : la SPA doit
      # être buildée en amont pour que la web UI release soit servie.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci && npm run build
        working-directory: client
      # Cible musl = binaire 100 % statique : plus d'exigence GLIBC_X.Y
      # — les tarballs release démarrent sur n'importe quelle distro
      # (Debian 11/12, Ubuntu 20.04/22.04/24.04…), là où un build
      # ubuntu-latest (glibc 2.39) refuse de tourner sur glibc < 2.39.
      - run: cargo build --release --target ${{ matrix.target }} -p agentcontrol-daemon -p acctl -p acp-claude
        env:
          # cc résout aarch64-linux-musl-gcc pour les cibles
          # aarch64-*-musl — absent : musl-tools ne fournit que
          # `musl-gcc`. Forcer le compilateur (sur le runner arm64 il
          # produit bien du aarch64-musl) ; sans effet sur x86_64.
          CC_aarch64_unknown_linux_musl: musl-gcc
          AR_aarch64_unknown_linux_musl: ar
      - name: package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/agentcontrol-daemon \
             target/${{ matrix.target }}/release/acctl \
             target/${{ matrix.target }}/release/acp-claude dist/
          # ac-wait : script (pas de build cargo) — exigé par les
          # prompts agents, son état est scanné par l'orchestrateur.
          install -m 755 tools/ac-wait dist/
          cp -r packaging dist/
          tar czf agentcontrol-server-${{ matrix.arch }}-linux.tar.gz -C dist .
      # Critère d'acceptation : les binaires tournent sur une vieille
      # glibc. `ldd` doit dire « statically linked » (static-PIE x86_64)
      # ou « not a dynamic executable » (ET_EXEC aarch64) et `acctl`
      # sans argument doit afficher son usage dans debian:bookworm
      # (glibc 2.36) — image native de l'arch du runner.
      - name: Vérif portabilité (debian:bookworm)
        run: |
          for bin in acctl agentcontrol-daemon; do
            # NB : `ldd` sort en code 1 sur un ET_EXEC statique — le
            # `|| true` évite que set -e avorte le step ; le grep sur
            # le contenu fait foi.
            ldd_out=$(docker run --rm -v "$PWD/dist:/ac" debian:bookworm ldd /ac/$bin 2>&1 || true)
            echo "== $bin"; echo "$ldd_out"
            echo "$ldd_out" | grep -qE 'statically linked|not a dynamic executable'
          done
          set +e
          help_out=$(docker run --rm -v "$PWD/dist:/ac" debian:bookworm /ac/acctl 2>&1)
          code=$?
          set -e
          echo "$help_out"
          [ "$code" -eq 2 ]
          echo "$help_out" | grep -q "usage: acctl"
      - uses: actions/upload-artifact@v4
        with:
          name: agentcontrol-server-${{ matrix.arch }}-linux
          path: agentcontrol-server-${{ matrix.arch }}-linux.tar.gz
          if-no-files-found: error

  # -----------------------------------------------------------------
  # Client desktop Tauri : Ubuntu + Windows
  # -----------------------------------------------------------------
  client:
    if: github.event.pull_request.draft != true
    timeout-minutes: 45
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Idem daemon : suffixe rc dans la version buildée. Windows exclu
      # de l'injection — MSI/NSIS exigent une version numérique : son
      # identité rc passe par AGENTCONTROL_RC compilée dans le binaire
      # (app_version "X.Y.Z-rc.K", version bundle toujours "X.Y.Z").
      - name: Version RC
        if: runner.os == 'Linux' && contains(github.ref_name, '-rc.')
        run: python3 client/tools/bump_version.py "${GITHUB_REF_NAME#v}"

      # Identité rc compilée : AGENTCONTROL_RC=K → app_version répond
      # « X.Y.Z-rc.K » (updater) sans toucher la version bundle —
      # sinon un client rc Windows s'identifiait « X.Y.Z » et restait
      # « à jour » à vie (semver : rc < stable à X.Y.Z égal). Posée
      # aussi sur Linux : inoffensif, l'injection y porte déjà le
      # suffixe et la garde anti double-suffixe l'ignore.
      - name: Identité RC compilée
        if: contains(github.ref_name, '-rc.')
        shell: bash
        run: echo "AGENTCONTROL_RC=${GITHUB_REF_NAME##*-rc.}" >> "$GITHUB_ENV"

      - name: Deps Tauri (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
        working-directory: client

      - name: Build Tauri
        working-directory: client
        run: npx tauri build

      - name: Artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: agentcontrol-client-linux
          path: |
            client/src-tauri/target/release/bundle/deb/*.deb
            client/src-tauri/target/release/bundle/appimage/*.AppImage
            client/src-tauri/target/release/agentcontrol
          if-no-files-found: error

      # Exe brut = version PORTABLE (sans install) — renommé pour
      # distinguer portable vs installer (nsis -setup.exe / msi).
      - name: Portable exe (Windows)
        if: runner.os == 'Windows'
        working-directory: client
        shell: pwsh
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force dist-win | Out-Null
          Copy-Item src-tauri/target/release/agentcontrol.exe "dist-win/AgentControl_${ver}_x64-portable.exe"

      - name: Artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: agentcontrol-client-windows
          path: |
            client/src-tauri/target/release/bundle/msi/*.msi
            client/src-tauri/target/release/bundle/nsis/*.exe
            client/dist-win/*.exe
          if-no-files-found: error

  # -----------------------------------------------------------------
  # Client desktop Tauri : macOS arm64 (.app + .dmg — non signé pour
  # l'instant, cf. README : installation via clic droit → Ouvrir ou
  # xattr -dr com.apple.quarantine).
  # -----------------------------------------------------------------
  client-macos:
    if: github.event.pull_request.draft != true
    timeout-minutes: 45
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Pas d'injection de version rc (idem Windows) : CFBundleVersion
      # exige du numérique — l'identité rc est compilée dans le binaire
      # via AGENTCONTROL_RC (cf. job client).
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - name: Identité RC compilée
        if: contains(github.ref_name, '-rc.')
        shell: bash
        run: echo "AGENTCONTROL_RC=${GITHUB_REF_NAME##*-rc.}" >> "$GITHUB_ENV"
      - name: Build Tauri
        working-directory: client
        run: npx tauri build
      - name: Renommer le .dmg avec la version
        working-directory: client
        run: |
          VER=$(grep -oE '"version": "[^"]+"' src-tauri/tauri.conf.json | head -1 | cut -d'"' -f4)
          # hors tag : suffixe SHA pour distinguer les builds de test (PR/main)
          SUFFIX=""
          if [ "${GITHUB_REF_NAME#v}" = "$GITHUB_REF_NAME" ]; then SUFFIX="-${GITHUB_SHA:0:7}"; fi
          mkdir -p dist-mac
          find src-tauri/target/release/bundle/dmg -name "*.dmg" \
            -exec sh -c 'mv "$1" "dist-mac/AgentControl_'"$VER$SUFFIX"'_aarch64.dmg"' _ {} \;
          find dist-mac -name "*.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: agentcontrol-client-macos
          path: client/dist-mac/*.dmg
          if-no-files-found: error

  # -----------------------------------------------------------------
  # Client Android : APK aarch64 (release-signé via keystore CI quand
  # les secrets ANDROID_KEYSTORE_* sont présents, debug sinon hors tag).
  # gen/android n'est pas commité → `tauri android init` dans le job.
  # -----------------------------------------------------------------
  client-android:
    if: github.event.pull_request.draft != true
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version RC
        if: contains(github.ref_name, '-rc.')
        run: python3 client/tools/bump_version.py "${GITHUB_REF_NAME#v}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: NDK
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager 2>/dev/null || find "$ANDROID_HOME" -name sdkmanager -type f | head -1)
          # NDK préinstallé sur le runner, sinon dernier `ndk;*` dispo
          NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/*/ 2>/dev/null | sort -V | tail -1)
          if [ -z "$NDK_DIR" ]; then
            VER=$("$SDKMANAGER" --list | grep -oE 'ndk;[0-9.]+' | sort -Vu | tail -1)
            "$SDKMANAGER" "$VER" "cmake;3.22.1"
            NDK_DIR="$ANDROID_HOME/ndk/${VER#ndk;}/"
          fi
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "NDK: $NDK_DIR"
      - run: npm ci
        working-directory: client
      - name: tauri android init + build APK
        working-directory: client
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npx tauri android init --ci
          # Caméra pour le scan QR d'appairage — manifest généré, patch
          # post-init (gen/android non commité). La webview gère le grant
          # runtime via onPermissionRequest (wry).
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.CAMERA"/>\n</manifest>|' \
            src-tauri/gen/android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' src-tauri/gen/android/app/src/main/AndroidManifest.xml
          # Pas de backup adb/cloud : app_data contient la clé privée
          # ed25519 et connections.json (secrets en clair) — le template
          # Tauri n'a pas d'allowBackup (défaut true). Patch post-init.
          sed -i 's|<application|<application\n        android:allowBackup="false"|' \
            src-tauri/gen/android/app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup="false"' \
            src-tauri/gen/android/app/src/main/AndroidManifest.xml
          # Portrait uniquement : patch post-init comme CAMERA / allowBackup
          # (gen/android n'est pas commité). Garde : une seule <activity>,
          # sinon le sed patcherait aussi des activités de plugins.
          test "$(grep -c '<activity' src-tauri/gen/android/app/src/main/AndroidManifest.xml)" = 1
          sed -i 's|<activity|<activity\n            android:screenOrientation="portrait"|' \
            src-tauri/gen/android/app/src/main/AndroidManifest.xml
          grep -q 'android:screenOrientation="portrait"' \
            src-tauri/gen/android/app/src/main/AndroidManifest.xml
          # Icônes commitées (tauri icon) → projet généré
          cp -r src-tauri/icons/android/* src-tauri/gen/android/app/src/main/res/
          # ── Signature release : sans keystore CI, chaque APK était
          # signé par le debug keystore éphémère du runner → signature
          # différente à chaque build → Android refuse l'update
          # in-place (INSTALL_FAILED_UPDATE_INCOMPATIBLE). Avec les
          # secrets ANDROID_KEYSTORE_* (upload keystore, cf.
          # client/tools/android-upload-keystore.sh) on build la
          # variante release et on signe l'APK par apksigner — le
          # projet Gradle généré n'a pas de signingConfig. Sans
          # secrets : builds PR/main → --debug (artefact de test
          # seulement) ; tags v* → fail-closed, une release Android
          # non signée ne doit plus jamais être publiée.
          SIGNED=0
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            SIGNED=1
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "::error::Secrets ANDROID_KEYSTORE_* absents — APK release non signable. Générer le keystore via client/tools/android-upload-keystore.sh puis gh secret set (cf. AGENTS.md § Releases)."
            exit 1
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 absent — APK --debug à signature éphémère (build de test, non publié)."
          fi
          if [ "$SIGNED" = 1 ]; then
            echo "ANDROID_SIGNED=1" >> "$GITHUB_ENV"
            MODE=""
            # Empreinte SHA-256 du certificat upload keystore, compilée
            # dans l'APK (AGENTCONTROL_ANDROID_CERT_SHA256 → build.rs →
            # app_signing → plugin ac-device) : le client compare le
            # signataire de l'APK installé à cette valeur pour savoir si
            # l'update in-place est possible (garde-fou uninstall —
            # backlog #232). Le keystore est décodé ici, avant le build
            # cargo qui lit l'env.
            KS_PRE="$RUNNER_TEMP/agentcontrol-upload-keystore.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KS_PRE"
            CERT_SHA=$("$JAVA_HOME/bin/keytool" -list -v -keystore "$KS_PRE" \
              -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              | awk '/SHA256:/{print $2; exit}' | tr -d ':' | tr 'A-F' 'a-f')
            # Fail-closed : une empreinte vide désactiverait silencieusement
            # le garde-fou uninstall (verdict "unknown" partout) — le
            # keystore est cassé si on arrive là, autant le voir ici.
            if [ -z "$CERT_SHA" ]; then
              echo "::error::Empreinte SHA-256 du keystore introuvable — garde-fou update Android non injectable."
              exit 1
            fi
            # GITHUB_ENV ne couvre que les steps suivants — l'export rend
            # la variable visible du `tauri android build` de CE step.
            export AGENTCONTROL_ANDROID_CERT_SHA256="$CERT_SHA"
          else
            echo "ANDROID_SIGNED=0" >> "$GITHUB_ENV"
            MODE="--debug"
          fi
          npx tauri android build --apk $MODE --target aarch64
          # ── Spike ac-stt : le plugin local plugins/ac-stt doit être
          # inclus sans patch — son build.rs émet
          # cargo:android_library_path qui remonte en
          # DEP_TAURI_PLUGIN_AC_STT_ANDROID_LIBRARY_PATH dans le build.rs
          # de l'app, lequel écrit tauri.settings.gradle. Fail-closed.
          grep -q ":tauri-plugin-ac-stt" src-tauri/gen/android/tauri.settings.gradle
          grep -q 'implementation(project(":tauri-plugin-ac-stt"))' \
            src-tauri/gen/android/app/tauri.build.gradle.kts
          # ac-device (verdict signature APK) : même mécanisme
          # cargo:android_library_path — sans lui app_signing planterait
          # au runtime (plugin non enregistré).
          grep -q ":tauri-plugin-ac-device" src-tauri/gen/android/tauri.settings.gradle
          grep -q 'implementation(project(":tauri-plugin-ac-device"))' \
            src-tauri/gen/android/app/tauri.build.gradle.kts
          # RECORD_AUDIO provient du manifest du module plugin, mergé
          # dans l'app par le manifest merger gradle.
          find src-tauri/gen/android/app/build/intermediates \
            -name "AndroidManifest.xml" -path "*merged*" \
            -exec grep -l "RECORD_AUDIO" {} \; | grep -q .
          # allowBackup="false" doit survivre au manifest merger.
          find src-tauri/gen/android/app/build/intermediates \
            -name "AndroidManifest.xml" -path "*merged*" \
            -exec grep -l 'allowBackup="false"' {} \; | grep -q .
          # screenOrientation doit survivre au manifest merger.
          find src-tauri/gen/android/app/build/intermediates \
            -name "AndroidManifest.xml" -path "*merged*" \
            -exec grep -l 'screenOrientation="portrait"' {} \; | grep -q .
          # L'AAR sherpa-onnx doit être lié : jniLibs arm64 dans l'APK.
          find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" \
            -exec sh -c 'unzip -l "$1" | grep -q "arm64-v8a/libsherpa-onnx-jni.so"' _ {} \;
          # Signature post-build (mode release uniquement) : l'APK
          # sort non signé (*-unsigned.apk) → zipalign puis apksigner
          # avec le keystore CI. Le certificat est identique à chaque
          # build → les updates in-place redeviennent possibles.
          if [ "$SIGNED" = 1 ]; then
            BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
            KS="$RUNNER_TEMP/agentcontrol-upload-keystore.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KS"
            mapfile -t APKLIST < <(find src-tauri/gen/android/app/build/outputs/apk -name "*-unsigned.apk")
            if [ "${#APKLIST[@]}" -eq 0 ]; then
              echo "::error::aucun APK *-unsigned.apk produit par le build release"
              exit 1
            fi
            for apk in "${APKLIST[@]}"; do
              echo "signature de $apk"
              "$BT/zipalign" -f -p 4 "$apk" "$apk.aligned"
              "$BT/apksigner" sign \
                --ks "$KS" \
                --ks-key-alias "$ANDROID_KEY_ALIAS" \
                --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
                --key-pass "pass:${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}" \
                --out "$apk.signed" "$apk.aligned"
              mv "$apk.signed" "$apk"
              rm -f "$apk.aligned"
            done
          fi
      - name: Vérifier signature et versionCode de l'APK
        working-directory: client
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ "${ANDROID_SIGNED:-0}" != "1" ]; then
            echo "APK non signé (build de test sans keystore) — vérification ignorée."
            exit 0
          fi
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          KS="$RUNNER_TEMP/agentcontrol-upload-keystore.jks"
          # Empreinte SHA-256 attendue du certificat signataire —
          # comparée au digest apksigner : un APK silencieusement
          # signé par une autre clé (ex. debug) fait échouer le job.
          EXPECT=$("$JAVA_HOME/bin/keytool" -list -v -keystore "$KS" \
            -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            | awk '/SHA256:/{print $2; exit}' | tr -d ':' | tr 'A-F' 'a-f')
          mapfile -t APKLIST < <(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk")
          for apk in "${APKLIST[@]}"; do
            echo "== $apk"
            "$BT/apksigner" verify --print-certs "$apk"
            GOT=$("$BT/apksigner" verify --print-certs "$apk" \
              | grep -oE 'SHA-256 digest: [0-9a-f]+' | head -1 \
              | grep -oE '[0-9a-f]{64}')
            if [ "$GOT" != "$EXPECT" ]; then
              echo "::error::certificat signataire inattendu ($GOT ≠ $EXPECT)"
              exit 1
            fi
            "$BT/aapt" dump badging "$apk" 2>/dev/null \
              | grep -E "^package:|versionCode" || true
          done
      - name: Renommer l'APK avec la version
        working-directory: client
        run: |
          VER=$(grep -oE '"version": "[^"]+"' src-tauri/tauri.conf.json | head -1 | cut -d'"' -f4)
          # hors tag : suffixe SHA pour distinguer les builds de test (PR/main)
          SUFFIX=""
          if [ "${GITHUB_REF_NAME#v}" = "$GITHUB_REF_NAME" ]; then SUFFIX="-${GITHUB_SHA:0:7}"; fi
          KIND="debug"; [ "${ANDROID_SIGNED:-0}" = "1" ] && KIND="release"
          find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" \
            -exec sh -c 'mv "$1" "$(dirname "$1")/AgentControl_'"$VER$SUFFIX"'_aarch64-'"$KIND"'.apk"' _ {} \;
          find src-tauri/gen/android/app/build/outputs/apk -name "*.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: agentcontrol-client-android
          path: client/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  # -----------------------------------------------------------------
  # Release GitHub sur tag v* (permet l'auto-update + install démon distant)
  # Intégrité (I1) : SHA256SUMS signé minisign + attestations Sigstore —
  # fail-closed sans les secrets MINISIGN_* (une release non signée ne
  # doit plus jamais être publiée, même politique que l'APK).
  # -----------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [daemon-linux, client, client-macos, client-android]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # OIDC Sigstore + store d'attestations — portés par CE seul job.
      id-token: write
      attestations: write
    steps:
      # Checkout requis avant le staging : packaging/agentcontrol.pub
      # sert à la contre-vérification de la signature produite.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: Signer SHA256SUMS (minisign)
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          # Fail-closed : tag v* sans la clé = release refusée (comme
          # ANDROID_KEYSTORE_* pour l'APK). La paire est générée une fois
          # hors CI ; la pubkey voyage dans packaging/agentcontrol.pub.
          if [ -z "${MINISIGN_KEY:-}" ]; then
            echo "::error::Secret MINISIGN_KEY absent — minisign -G -p packaging/agentcontrol.pub -s <clé hors repo> puis gh secret set MINISIGN_KEY (+ MINISIGN_PASSWORD si chiffrée) ; cf. AGENTS.md § Releases."
            exit 1
          fi
          if grep -q PLACEHOLDER packaging/agentcontrol.pub; then
            echo "::error::packaging/agentcontrol.pub est encore le placeholder — commiter la vraie clé publique issue de la paire de signature."
            exit 1
          fi
          if ! command -v minisign >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          fi
          # Artefacts à plat dans release-files/ : les assets publiés
          # portent leur basename → SHA256SUMS les liste tels quels, ce
          # qui rend `sha256sum -c` directement rejouable en local.
          mkdir -p release-files
          expect=$(find agentcontrol-* -type f | wc -l)
          find agentcontrol-* -type f -exec cp -t release-files {} +
          got=$(find release-files -type f | wc -l)
          if [ "$got" != "$expect" ]; then
            echo "::error::collision de noms d'artefacts ($got/$expect fichiers)"
            exit 1
          fi
          (cd release-files && sha256sum -- * > SHA256SUMS)
          cat release-files/SHA256SUMS
          # La clé privée ne vit que dans $RUNNER_TEMP (umask 077, rm
          # immédiat) — jamais sur le workspace, jamais en log.
          KEY="$RUNNER_TEMP/agentcontrol-minisign.key"
          umask 077
          printf '%s\n' "$MINISIGN_KEY" > "$KEY"
          # Mot de passe : MINISIGN_PASSWORD est lue par minisign ≥0.10 ;
          # le pipe stdin couvre les versions antérieures sans tty.
          printf '%s\n' "${MINISIGN_PASSWORD:-}" | timeout 60 minisign -S \
            -m release-files/SHA256SUMS -x release-files/SHA256SUMS.minisig \
            -s "$KEY" -t "release ${GITHUB_REF_NAME}"
          rm -f "$KEY"
          # Contre-vérif immédiate : la signature doit correspondre à la
          # pubkey embarquée dans les binaires — une clé secrète qui ne
          # matche pas packaging/agentcontrol.pub publierait des releases
          # invérifiables chez tous les clients → casser la release ici.
          minisign -V -m release-files/SHA256SUMS \
            -x release-files/SHA256SUMS.minisig -p packaging/agentcontrol.pub
      - name: Attestations de provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "release-files/*"
      - uses: softprops/action-gh-release@v2
        with:
          files: "release-files/*"
          # Tags vX.Y.Z-rc.K → prerelease GitHub JAMAIS marquée "latest"
          # (sinon releases/latest — la sonde stable de l'app et le
          # Dockerfile devcontainer — renverrait la rc aux utilisateurs
          # du canal stable).
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          make_latest: ${{ !contains(github.ref_name, '-rc.') }}

