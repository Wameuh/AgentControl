name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # -----------------------------------------------------------------
  # Démon + outils : Linux x86_64 (le serveur cible)
  # -----------------------------------------------------------------
  daemon-linux:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p agentcontrol-daemon -p acctl
      - name: package
        run: |
          mkdir -p dist
          cp target/release/agentcontrol-daemon target/release/acctl dist/
          cp -r packaging dist/
          tar czf agentcontrol-server-${{ matrix.arch }}-linux.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: agentcontrol-server-${{ matrix.arch }}-linux
          path: agentcontrol-server-${{ matrix.arch }}-linux.tar.gz

  # -----------------------------------------------------------------
  # Client desktop Tauri : Ubuntu + Windows
  # -----------------------------------------------------------------
  client:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Deps Tauri (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
        working-directory: client

      - name: Build Tauri
        working-directory: client
        run: npx tauri build

      - name: Artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: agentcontrol-client-linux
          path: |
            client/src-tauri/target/release/bundle/deb/*.deb
            client/src-tauri/target/release/bundle/appimage/*.AppImage
            client/src-tauri/target/release/agentcontrol

      - name: Artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: agentcontrol-client-windows
          path: |
            client/src-tauri/target/release/bundle/msi/*.msi
            client/src-tauri/target/release/bundle/nsis/*.exe
            client/src-tauri/target/release/agentcontrol.exe

  # -----------------------------------------------------------------
  # Release GitHub sur tag v* (permet l'auto-update + install démon distant)
  # -----------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [daemon-linux, client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: "**/*"

