name: Bug report
description: Something isn't working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: versions
    attributes:
      label: App and daemon versions
      description: "Both versions — Settings → About in the app, or `acctl status`"
      placeholder: "e.g. app 0.9.0, daemon 0.9.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating systems
      description: Client OS and daemon host OS
      placeholder: "e.g. Windows 11 client, Ubuntu 24.04 server"
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent used
      description: Which agent the session runs, if relevant
      placeholder: "e.g. devin, claude, codex, cursor"
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, what you expected, what happened instead
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Relevant daemon or client logs, if any.
        Remove secrets first — session tokens, keys and pairing codes can appear in logs.
    validations:
      required: false
