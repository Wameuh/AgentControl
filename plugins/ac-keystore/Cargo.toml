[package]
name = "tauri-plugin-ac-keystore"
version = "0.1.0"
edition = "2021"
build = "build.rs"
links = "tauri-plugin-ac-keystore"
description = "Secrets au repos chiffrés via Android Keystore (AES/GCM, clé non exportable)."

# Crate indépendante du workspace racine — dépendance par path de
# client/src-tauri, à l'image de tauri-plugin-ac-stt.
[workspace]

[lib]
name = "tauri_plugin_ac_keystore"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
