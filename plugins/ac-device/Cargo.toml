[package]
name = "tauri-plugin-ac-device"
version = "0.1.0"
edition = "2021"
build = "build.rs"
links = "tauri-plugin-ac-device"
description = "Infos appareil Android exposées au client (signature de l'APK installé — update in-place possible ou non)."

# Crate indépendante du workspace racine — dépendance par path de
# client/src-tauri, à l'image de tauri-plugin-ac-keystore.
[workspace]

[lib]
name = "tauri_plugin_ac_device"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
